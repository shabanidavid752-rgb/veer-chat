<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:#075e54;color:#fff;padding:15px;font-size:22px;font-weight:bold}
.chat{background:#fff;padding:12px;border-bottom:1px solid #ddd;cursor:pointer}
#chatView{display:none;flex-direction:column;height:100vh}
#msgs{flex:1;overflow:auto;padding:10px}
.msg{background:#fff;padding:8px;margin:5px;border-radius:8px;max-width:80%}
.me{background:#dcf8c6;margin-left:auto}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc}
button{padding:10px 15px;border-radius:20px;border:none;background:#075e54;color:#fff}
</style>
</head>
<body>
<div id="listView">
<div class="header">VEER</div>
<div class="chat" onclick="openChat('VEER AI','ai')"><b>VEER AI ✅</b><br><small>Online</small></div>
<div class="chat" onclick="openChat('General','general')"><b>General</b><br><small>Group</small></div>
<div class="chat" onclick="openChat('Friends','friends')"><b>Friends</b><br><small>Group</small></div>
</div>

<div id="chatView">
<div class="header"><span onclick="goBack()" style="cursor:pointer">⬅ </span><span id="headName"></span></div>
<div id="msgs"></div>
<div style="display:flex;padding:10px;gap:5px;background:#fff">
<input id="txt" placeholder="Type message...">
<button onclick="sendMsg()">Send</button>
</div>
</div>

<script>
var API_KEY = localStorage.getItem("VEER_KEY") || "";
if(!API_KEY){
API_KEY = prompt("Weka Gemini API Key yako:");
localStorage.setItem("VEER_KEY", API_KEY);
}
var currentKey="ai";
var chats={ai:[],general:[],friends:[]};

function openChat(name,key){
currentKey=key;
document.getElementById("listView").style.display="none";
document.getElementById("chatView").style.display="flex";
document.getElementById("headName").innerText=name;
render();
}
function goBack(){
document.getElementById("chatView").style.display="none";
document.getElementById("listView").style.display="block";
}
function render(){
var box=document.getElementById("msgs");
box.innerHTML="";
for(var i=0;i<chats[currentKey].length;i++){
var m=chats[currentKey][i];
var d=document.createElement("div");
d.className="msg"+(m.u=="You"?" me":"");
d.innerText=m.u+": "+m.t;
box.appendChild(d);
}
box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
var t=document.getElementById("txt");
if(!t.value) return;
var txt=t.value; t.value="";
chats[currentKey].push({u:"You",t:txt});
render();
if(currentKey!=="ai") return;
try{
var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+API_KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:txt}]}]})});
var j=await r.json();
var ans=j.candidates[0].content.parts[0].text;
chats[currentKey].push({u:"VEER AI",t:ans});
}catch(e){
chats[currentKey].push({u:"VEER AI",t:"Pole, mtandao una shida. Jaribu tena."});
}
render();
}
</script>
</body>
</html>
