<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#ece5dd}
.header{background:#075E54;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px}
.header span{font-size:20px}
.search{background:#fff;margin:8px;padding:10px;border-radius:20px;color:#888;font-size:14px}
.chat-list{background:#fff}
.chat{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;flex-shrink:0}
.avatar.ai{background:#075E54}
.info{flex:1;margin-left:12px;overflow:hidden}
.info b{font-size:16px}
.info p{font-size:13px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:#25D366;text-align:right}
.badge{background:#25D366;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:4px;float:right}
.chat-view{display:none;flex-direction:column;height:100vh}
.chat-head{background:#075E54;color:#fff;padding:12px;display:flex;align-items:center;gap:10px}
.chat-head small{color:#d4f8c5}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#ece5dd}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;font-size:15px}
.me{background:#dcf8c6;align-self:flex-end}
.other{background:#fff;align-self:flex-start}
.ai-msg{background:#fff;align-self:flex-start;border-left:3px solid #075E54}
.input{display:flex;padding:8px;background:#f0f0f0;gap:8px}
.input input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
.input button{background:#25D366;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:20px}
.back{font-size:22px;cursor:pointer}
</style>
</head>
<body>

<div id="listView">
  <div class="header"><h1>VEER</h1><span>🔍 ⋮</span></div>
  <div class="search">🔍 Tafuta chat...</div>
  <div class="chat-list">
    <div class="chat" onclick="openChat('VEER AI','ai')">
      <div class="avatar ai">V</div>
      <div class="info"><b>VEER AI ✅</b><p id="last-ai">Mambo! Niko hapa, niambie...</p></div>
      <div><div class="time">Sasa</div><div class="badge">1</div></div>
    </div>
    <div class="chat" onclick="openChat('General','general')">
      <div class="avatar" style="background:#128C7E">G</div>
      <div class="info"><b>General</b><p>Chat ya wote...</p></div>
      <div><div class="time">Sasa</div></div>
    </div>
    <div class="chat" onclick="openChat('Marafiki','marafiki')">
      <div class="avatar" style="background:#FF9800">M</div>
      <div class="info"><b>Marafiki</b><p>Tuongee hapa...</p></div>
      <div><div class="time">Sasa</div></div>
    </div>
    <div class="chat" onclick="openChat('Familia','familia')">
      <div class="avatar" style="background:#E91E63">F</div>
      <div class="info"><b>Familia</b><p>Habari za nyumbani...</p></div>
      <div><div class="time">Sasa</div></div>
    </div>
  </div>
</div>

<div id="chatView" class="chat-view">
  <div class="chat-head"><span class="back" onclick="goBack()">←</span><div class="avatar ai" id="headAv">V</div><div><b id="headName">VEER AI</b><br><small id="headStatus">online</small></div></div>
  <div class="msgs" id="msgs"></div>
  <div class="input"><input id="inp" placeholder="Andika ujumbe..."><button onclick="send()">➤</button></div>
</div>

<script>
let current='ai';
let chats={ai:[{t:'Mambo! Niko hapa, niambie unataka nini? 😊',me:false,ai:true}],general:[],marafiki:[],familia:[]};
function openChat(name,key){
  current=key;
  document.getElementById('listView').style.display='none';
  document.getElementById('chatView').style.display='flex';
  document.getElementById('headName').innerText=name;
  document.getElementById('headStatus').innerText = key==='ai' ? 'online - anajibu sasa hivi' : 'Watu 3 wapo';
  render();
}
function goBack(){
  document.getElementById('listView').style.display='block';
  document.getElementById('chatView').style.display='none';
}
function render(){
  let box=document.getElementById('msgs'); box.innerHTML='';
  chats[current].forEach(m=>{
    let d=document.createElement('div');
    d.className='msg '+(m.me?'me':(m.ai?'ai-msg':'other'));
    d.innerText=m.t; box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
function send(){
  let inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt) return;
  chats[current].push({t:txt,me:true}); inp.value=''; render();
  if(current==='ai'){
    setTimeout(()=>{
      chats.ai.push({t:aiReply(txt),me:false,ai:true});
      document.getElementById('last-ai').innerText=aiReply(txt);
      render();
    },800);
  }
}
function aiReply(txt){
  txt=txt.toLowerCase();
  if(txt.includes('mambo')||txt.includes('habari')) return 'Poa sana! Mimi niko vizuri. Wewe uko aje? 😊';
  if(txt.includes('jina')) return 'Mimi ni VEER AI, rafiki yako wa hapa VEER. Niko hapa kukusaidia na kuongea na wewe!';
  if(txt.includes('nini')&&txt.includes('fanya')) return 'Naweza kuongea na wewe, kukupa mawazo, kukusaidia kuandika ujumbe, na kukupa habari. Niambie unataka nini?';
  if(txt.includes('sawa')||txt.includes('poa')) return 'Sawa kabisa! 😄 Unataka tuongee kuhusu nini sasa?';
  if(txt.includes('asante')) return 'Karibu sana! Niko hapa muda wote. ❤️';
  if(txt.includes('bye')||txt.includes('kwaheri')) return 'Kwaheri! Usisahau kurudi, nitakumiss! 👋';
  if(txt.includes('mchezo')||txt.includes('cheza')) return 'Sawa tucheze! Niambie namba 1 hadi 10, nikubashirie uliyochagua 😄';
  return 'Nimekuelewa! Niambie zaidi kidogo, nataka nikusaidie vizuri. Unataka tuongee kuhusu nini?';
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
