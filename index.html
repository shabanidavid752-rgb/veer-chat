<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEER AI</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
header{background:#1e293b;padding:15px;text-align:center;font-weight:bold;font-size:20px}
header button{float:right;background:red;color:white;border:none;padding:5px 10px;border-radius:5px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:85%}
.user{background:#2563eb;align-self:flex-end}
.ai{background:#334155;align-self:flex-start}
#box{display:flex;padding:10px;background:#1e293b;gap:8px}
input{flex:1;padding:12px;border-radius:10px;border:none;outline:none}
#send{background:#2563eb;color:white;border:none;padding:12px 18px;border-radius:10px}
</style>
</head>
<body>
<header>VEER AI <button onclick="badilishaKey()">Badilisha Key</button></header>
<div id="chat"></div>
<div id="box"><input id="input" placeholder="Andika hapa..."><button id="send" onclick="tuma()">Tuma</button></div>

<script>
let KEY = localStorage.getItem("VEER_KEY");
if(!KEY || KEY.length < 10){
  KEY = prompt("Weka Gemini API Key yako:");
  if(KEY) localStorage.setItem("VEER_KEY", KEY.trim());
}
function badilishaKey(){
  localStorage.removeItem("VEER_KEY");
  location.reload();
}
function ongeza(text, aina){
  let d = document.createElement("div");
  d.className = "msg " + aina;
  d.innerText = text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop = 99999;
}
async function tuma(){
  let inp = document.getElementById("input");
  let swali = inp.value.trim();
  if(!swali) return;
  ongeza(swali, "user");
  inp.value = "";
  ongeza("VEER anaandika...", "ai");
  try{
    let res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + KEY, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({contents:[{parts:[{text: swali}]}]})
    });
    let data = await res.json();
    document.querySelectorAll(".ai").item(document.querySelectorAll(".ai").length-1).remove();
    if(data.error){
      ongeza("KOSA: " + data.error.message, "ai");
      if(data.error.message.includes("API key")) badilishaKey();
      return;
    }
    ongeza(data.candidates[0].content.parts[0].text, "ai");
  }catch(e){
    ongeza("Pole, kuna shida: " + e.message, "ai");
  }
}
</script>
</body>
</html>
