<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{ background:#0f172a; font-family:sans-serif; display:flex; justify-content:center; padding:20px; }
.app{ background:white; width:100%; max-width:400px; border-radius:16px; overflow:hidden; }
.header{ background:#7c3aed; color:white; padding:15px; font-weight:bold; text-align:center; font-size:20px; }
#messages{ height:350px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
.msg{ background:#f1f5f9; padding:8px 12px; border-radius:12px; }
.msg b{ color:#7c3aed; }
.input-row{ display:flex; padding:10px; gap:8px; }
input{ flex:1; padding:10px; border-radius:10px; border:1px solid #ddd; }
button{ background:#7c3aed; color:white; border:none; padding:10px 16px; border-radius:10px; font-weight:bold; }
</style>
</head>
<body>
<div class="app">
  <div class="header">💬 VEER chat</div>
  <div id="messages">Inapakia ujumbe...</div>
  <div class="input-row">
    <input id="msgInput" placeholder="Andika ujumbe..." />
    <button onclick="sendMsg()">Tuma</button>
  </div>
</div>
<script>
const SUPA_URL = "https://tvtpulkkyxgifenifpgi.supabase.co/rest/v1/veer_messages";
const KEY = "sb_publishable_PQk6lhy2NiFsHoUC08h4UQ_fja0Ylww";
let username = "Mgeni" + Math.floor(Math.random()*9000+1000);
async function loadMsgs(){
  let res = await fetch(SUPA_URL + "?order=created_at.asc&limit=100", { headers: { "apikey": KEY, "Authorization": "Bearer " + KEY } });
  let data = await res.json();
  let box = document.getElementById("messages");
  box.innerHTML = "";
  data.forEach(m => { box.innerHTML += "<div class='msg'><b>" + m.username + ":</b> " + m.message + "</div>"; });
  box.scrollTop = box.scrollHeight;
}
async function sendMsg(){
  let input = document.getElementById("msgInput");
  let text = input.value.trim();
  if(!text) return;
  await fetch(SUPA_URL, { method: "POST", headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Content-Type": "application/json", "Prefer": "return=minimal" }, body: JSON.stringify({ username: username, message: text }) });
  input.value = ""; loadMsgs();
}
loadMsgs();
</script>
</body>
</html>
