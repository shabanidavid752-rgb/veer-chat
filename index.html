<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VEER LIVE</title> <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#250366"> <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#250366"> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}header{padding:14px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between}header b{color:#00ff88}#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{background:#1a1a1a;padding:10px 14px;border-radius:14px;max-width:85%}.msg b{color:#00ff88;font-size:11px}.msg.me{align-self:flex-end;background:#00ff88;color:#000}.msg.me b{color:#000}#inputArea{padding:12px;display:flex;gap:8px;background:#111}input{flex:1;padding:12px 16px;border-radius:25px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}button{padding:12px 20px;border-radius:25px;border:none;background:#00ff88;color:#000;font-weight:700}#login{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;z-index:99}#login input,#login button{width:100%;max-width:320px;margin-top:12px}</style></head><body><div id="login"><h2 style="color:#00ff88;letter-spacing:3px">VEER</h2><p style="margin-top:8px;color:#888">Ingiza jina</p><input id="usernameInput" placeholder="Jina lako..."><button onclick="join()">INGIA</button></div><header><b>VEER CHAT</b><span id="userLabel" style="font-size:12px;color:#888"></span></header><div id="messages"></div><div id="inputArea"><input id="msgInput" placeholder="Andika..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">TUMA</button></div><script>const SUPABASE_URL='https://tvtpulkkyxgifenifpgi.supabase.co';const SUPABASE_KEY='sb_publishable_PQk6lhy2NiFsHoUC08h4UQ_fja0Ylww';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let username='';function join(){const v=document.getElementById('usernameInput').value.trim();if(!v)return alert('Weka jina');username=v;document.getElementById('login').style.display='none';document.getElementById('userLabel').innerText=username;loadMessages();subscribe();}async function loadMessages(){const{data}=await supabaseClient.from('veer_messages').select('*').order('created_at',{ascending:true}).limit(100);document.getElementById('messages').innerHTML='';if(data)data.forEach(addMsgToUI);}function addMsgToUI(m){const div=document.createElement('div');div.className='msg'+(m.username===username?' me':'');div.innerHTML=`<b>${m.username}</b><p>${m.message}</p>`;document.getElementById('messages').appendChild(div);document.getElementById('messages').scrollTop=99999;}async function send(){const input=document.getElementById('msgInput');const text=input.value.trim();if(!text)return;input.value='';await supabaseClient.from('veer_messages').insert({username,message:text});}function subscribe(){supabaseClient.channel('veer-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'veer_messages'},p=>{addMsgToUI(p.new)}).subscribe();}document.getElementById('usernameInput').value='Mgeni'+Math.floor(Math.random()*9000+1000);setTimeout(join,500);  (function(){var s=document.createElement('style');s.textContent="#chatMessages{display:flex;flex-direction:column;gap:8px;padding:10px}#chatMessages>div{max-width:78%;padding:8px 12px;border-radius:14px;background:#1f2937;align-self:flex-start}#chatMessages>div.own{background:#00a884;align-self:flex-end}#chatMessages>div.own div:first-child{color:#eafff3!important}.msg-time{font-size:11px;opacity:.6;text-align:right;margin-top:4px}";document.head.appendChild(s);var h=document.querySelector('header')||document.body;var b=document.createElement('button');b.textContent='⚙️';b.style.cssText='background:none;border:none;font-size:22px;cursor:pointer;margin-left:8px';b.onclick=function(){var n=prompt('Badilisha jina lako:',window.username||'');if(n){window.username=n;localStorage.setItem('veer_name',n);var el=document.getElementById('usernameInput');if(el)el.value=n;location.reload();}};var top=document.body.querySelector('div');if(top)top.appendChild(b);function fix(){var me=window.username||'';document.querySelectorAll('#chatMessages>div').forEach(function(d){var nm=d.querySelector('div');if(nm&&me&&nm.textContent.trim()===me.trim())d.classList.add('own');if(!d.querySelector('.msg-time')){var t=document.createElement('div');t.className='msg-time';t.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.appendChild(t);}});}setInterval(fix,1000);fix();})(); (function(){var s=document.createElement('style');s.textContent="body>div{padding-bottom:60px}div{box-sizing:border-box}";document.head.appendChild(s);var btn=document.createElement('button');btn.textContent='⚙️';btn.style.cssText='position:fixed;top:8px;right:110px;z-index:9999;background:#222;border:1px solid #00ff88;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer';btn.onclick=function(){var n=prompt('Andika jina lako jipya:');if(n){localStorage.setItem('veer_myname',n);alert('Sasa tuma message mpya, itaonekana kulia kijani');}};document.body.appendChild(btn);function getMe(){var m=document.body.innerText.match(/Mgeni\d+/);return m?m[0]:localStorage.getItem('veer_myname')||''}function fix(){var me=getMe();document.querySelectorAll('div').forEach(function(d){if(d.children.length===2&&d.querySelector('div')){var name=d.children[0].textContent.trim();if(name&&d.textContent.length<200){d.style.cssText+=';max-width:78%;padding:8px 12px;border-radius:14px;margin:6px 10px;background:#1f2937;align-self:flex-start;display:block';if(name===me){d.style.background='#00a884';d.style.marginLeft='auto';d.style.marginRight='10px';}if(!d.querySelector('.tm')){var t=document.createElement('div');t.className='tm';t.style.cssText='font-size:11px;opacity:.6;text-align:right';t.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.appendChild(t);}}}});}setInterval(fix,800);})(); </script></body></html>
