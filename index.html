<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEER AI</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
header{background:#1e293b;padding:15px;text-align:center;font-weight:bold;font-size:20px}
header button{background:red;color:white;border:none;padding:6px 10px;border-radius:5px;margin-left:5px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:85%}
.user{background:#2563eb;align-self:flex-end}
.ai{background:#334155;align-self:flex-start}
#box{display:flex;padding:10px;background:#1e293b;gap:8px}
input{flex:1;padding:12px;border-radius:10px;border:none;outline:none}
#send{background:#2563eb;color:white;border:none;padding:12px 18px;border-radius:10px}
</style>
</head>
<body>
<header>VEER AI <button onclick="badilishaKey()">Badilisha Key</button> <button onclick="futaChat()" style="background:#475569">Futa Chat</button></header>
<div id="chat"></div>
<div id="box"><input id="input" placeholder="Andika hapa..."><button id="send" onclick="tuma()">Tuma</button></div>
<script>
let KEY = localStorage.getItem("VEER_KEY");
if(!KEY || KEY.length < 10){
  KEY = prompt("Weka Gemini API Key yako:");
  if(KEY) localStorage.setItem("VEER_KEY", KEY.trim());
}
function badilishaKey(){ localStorage.removeItem("VEER_KEY"); location.reload(); }
function futaChat(){ localStorage.removeItem("VEER_CHATS"); document.getElementById("chat").innerHTML=""; }

// Pakia chats za zamani
let saved = JSON.parse(localStorage.getItem("VEER_CHATS") || "[]");
saved.forEach(c => ongeza(c.text, c.type, false));

function ongeza(text, aina, hifadhi=true){
  let d = document.createElement("div");
  d.className = "msg " + aina;
  d.innerText = text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop = 99999;
  if(hifadhi){
    saved.push({text, type: aina});
    localStorage.setItem("VEER_CHATS", JSON.stringify(saved));
  }
  return d;
}
async function tuma(){
  async function tuma(){
  let inp = document.getElementById("input");
  let swali = inp.value.trim();
  if(!swali) return;
  ongeza(swali, "user");
  inp.value = "";
  let loading = ongeza("VEER anaandika...", "ai", false);
  let models = ["gemini-3.8-flash", "gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-1.5-flash"];
  let jibu = null;
  for(let m of models){
    try{
      let res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key=" + KEY, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({contents:[{parts:[{text: swali}]}]})
      });
      let data = await res.json();
      if(data.candidates){
        jibu = data.candidates[0].content.parts[0].text;
        break;
      }
    }catch(e){}
  }
  loading.remove();
  if(jibu) ongeza(jibu, "ai");
  else ongeza("Pole, Google wamejaa sana sasa hivi. Jaribu tena baada ya sekunde 30.", "ai");
}
</script>
</body>
</html>
