<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#ece5dd}
.header{background:#075E54;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px}
.chat-list{background:#fff}
.chat{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;flex-shrink:0}
.avatar.ai{background:#075E54}
.info{flex:1;margin-left:12px;overflow:hidden}
.info b{font-size:16px}
.info p{font-size:13px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-view{display:none;flex-direction:column;height:100vh}
.chat-head{background:#075E54;color:#fff;padding:12px;display:flex;align-items:center;gap:10px}
.chat-head small{color:#d4f8c5}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#ece5dd}
.msg{max-width:80%;padding:8px 10px;border-radius:8px;font-size:15px;white-space:pre-wrap}
.me{background:#dcf8c6;align-self:flex-end}
.ai-msg{background:#fff;align-self:flex-start;border-left:3px solid #075E54}
.input{display:flex;padding:8px;background:#f0f0f0;gap:8px}
.input input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
.input button{background:#25D366;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:20px}
.back{font-size:22px;cursor:pointer}
</style>
</head>
<body>
<div id="listView">
<div class="header"><h1>VEER</h1><span>🔍 ⋮</span></div>
<div class="chat-list">
<div class="chat" onclick="openChat('VEER AI','ai')"><div class="avatar ai">V</div><div class="info"><b>VEER AI ✅</b><p id="last-ai">Mambo! Uliza chochote...</p></div></div>
<div class="chat" onclick="openChat('General','general')"><div class="avatar" style="background:#128C7E">G</div><div class="info"><b>General</b><p>Chat ya wote...</p></div></div>
<div class="chat" onclick="openChat('Marafiki','marafiki')"><div class="avatar" style="background:#FF9800">M</div><div class="info"><b>Marafiki</b><p>Tuongee hapa...</p></div></div>
</div>
</div>
<div id="chatView" class="chat-view">
<div class="chat-head"><span class="back" onclick="goBack()">←</span><div class="avatar ai">V</div><div><b id="headName">VEER AI</b><br><small id="headStatus">online - AI wa kweli</small></div></div>
<div class="msgs" id="msgs"></div>
<div class="input"><input id="inp" placeholder="Uliza chochote..."><button onclick="send()">➤</button></div>
</div>
<script>
const API_KEY = "WEKA_API_KEY_YAKO_HAPA";
let current='ai';
let chats={ai:[{t:'Mambo! Mimi ni VEER AI wa kweli sasa. Uliza chochote - Statistics, Falsafa, Curriculum ya nchi yoyote...',me:false,ai:true}],general:[],marafiki:[]};
function openChat(name,key){
  current=key;
  document.getElementById('listView').style.display='none';
  document.getElementById('chatView').style.display='flex';
  document.getElementById('headName').innerText=name;
  render();
}
function goBack(){
  document.getElementById('listView').style.display='block';
  document.getElementById('chatView').style.display='none';
}
function render(){
  let box=document.getElementById('msgs'); box.innerHTML='';
  chats[current].forEach(m=>{
    let d=document.createElement('div');
    d.className='msg '+(m.me?'me':'ai-msg');
    d.innerText=m.t; box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
async function send(){
  let inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt) return;
  chats[current].push({t:txt,me:true}); inp.value=''; render();
  if(current!=='ai') return;
  chats.ai.push({t:'VEER AI anaandika...',me:false,ai:true}); render();
  let answer = await askGemini(txt);
  chats.ai[chats.ai.length-1].t = answer;
  document.getElementById('last-ai').innerText=answer;
  render();
}
async function askGemini(question){
  if(!API_KEY || API_KEY==="AQ.Ab8RN6JpR9Kg4is3zXqqk7Yffviw8Knafy_tqdZrXePSz1qBdQ
    return 'Bado hujaweka API Key. Nenda Google AI Studio, chukua key, uibandike kwenye code pale palipoandikwa WEKA_API_KEY_YAKO_HAPA.';
  }
  try{
    let res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+API_KEY,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{parts:[{text:'Jibu kwa Kiswahili rahisi, kifupi na wazi. Kama swali ni la Kiingereza jibu kwa Kiingereza. Swali: '+question}]}]})
    });
    let data = await res.json();
    if(data.candidates && data.candidates[0].content.parts[0].text){
      return data.candidates[0].content.parts[0].text;
    } else {
      return 'Pole, Gemini ameshindwa kujibu sasa. Jaribu tena baada ya sekunde chache.';
    }
  }catch(e){
    return 'Pole, kuna tatizo la mtandao. Hakikisha una internet na API Key iko sahihi. Jaribu tena.';
  }
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
